version: 2

project_name: cheep

before:
  hooks:
    - go mod verify

builds:
  - id: cheep
    main: ./cmd/cheep
    binary: cheep
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/turushan/cheep/internal/buildinfo.version={{.Version}}
        -X github.com/turushan/cheep/internal/buildinfo.commit={{.Commit}}

archives:
  - id: cheep
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  draft: true
  github:
    owner: turushan
    name: cheep
